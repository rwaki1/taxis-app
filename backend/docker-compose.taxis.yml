version: '3.8'

services:
  taxis-mysql:
    image: mysql:8.0
    container_name: taxis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taxis_app
      MYSQL_USER: taxis_user
      MYSQL_PASSWORD: taxis_pass
    ports:
      - "3307:3306"
    volumes:
      - taxis_db_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

volumes:
  taxis_db_data:
